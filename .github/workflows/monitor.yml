name: Monitor and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: baby-watchtower-production
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: monitor-state
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monitoring logic
        run: node --test lib/*.test.mjs scripts/*.test.mjs
      - name: Build updated interface
        if: github.event_name == 'push'
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run website checks
        env:
          MONITOR_STATE_PATH: monitor-state/state.json
          MONITOR_OUTPUT_PATH: docs/data/dashboard.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check.mjs
      - name: Persist incident history
        working-directory: monitor-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record monitoring observation"
            git push origin HEAD:monitor-state
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
